<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Watch · str▶eam</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">
  <script>document.documentElement.classList.add("auth-wait");try{if(localStorage.getItem("stream-kids")==="1")document.documentElement.classList.add("kids")}catch(e){}setTimeout(function(){document.documentElement.classList.remove("auth-wait")},6000)</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../icons/icon-192.png" type="image/png" sizes="192x192">
</head>
<body class="watch">
  <div id="p"></div>

  <script src="../app.js"></script>
  <script src="../player.js"></script>
  <script src="../ads.js"></script>
  <script>
  (function () {
    var id = new URLSearchParams(location.search).get("id"), curFilm = null;
    var pl = Player.mount(document.getElementById("p"), {
      full: true, fullscreenOnPlay: true, keys: true,
      back: "../movie/?id=" + encodeURIComponent(id || ""),
      onProgress: function (t, d) { Stream.save(id, t, d); },
      report: function () { Stream.reportDialog(curFilm ? curFilm.title : "this film", "Film: " + (curFilm ? curFilm.title : "") + "\nID: " + id); }
    });
    if (!id) { pl.say("No movie selected."); return; }

    Stream.movies().then(function (all) {
      var m = all.filter(function (x) { return x.id === id; })[0];
      if (!m) { pl.say("Film not found."); return; }
      document.title = m.title + " · str▶eam";
      pl.setTitle(m.title); curFilm = m;
      var pa = Stream.progress();
      var nxt = all.filter(function (x) { return x.id !== id && !(pa[x.id] && pa[x.id].d && pa[x.id].t > pa[x.id].d - 30); })
        .sort(function (a, b) { return (b.genre === m.genre ? 1 : 0) - (a.genre === m.genre ? 1 : 0); })[0];
      pl.video.addEventListener("ended", function () {
        if (pl.video.duration) Stream.save(id, pl.video.duration, pl.video.duration);
        if (!nxt) return;
        var box = document.createElement("div"); box.className = "upnext glass";
        box.appendChild(Stream.poster(nxt, "un-poster"));
        var info = document.createElement("div"); info.className = "un-info";
        var s1 = document.createElement("small"); s1.textContent = "Up next";
        var b = document.createElement("b"); b.textContent = nxt.title;
        var row = document.createElement("div"); row.className = "un-row";
        var play = document.createElement("a"); play.className = "btn sm"; play.textContent = "Play now"; play.href = Stream.watchUrl(nxt.id);
        var cl = document.createElement("button"); cl.type = "button"; cl.className = "btn sm ghost"; cl.textContent = "Close"; cl.onclick = function () { if (box.parentNode) box.parentNode.removeChild(box); };
        row.appendChild(play); row.appendChild(cl); info.appendChild(s1); info.appendChild(b); info.appendChild(row); box.appendChild(info);
        document.getElementById("p").appendChild(box);
      });
      pl.poster(Stream.thumb(id));
      var s = Stream.progress()[id], at = s && s.t > 5 && s.t < s.d - 30 ? s.t : 0;
      pl.setStart(at ? "Resume from " + Player.fmt(at) : "Tap to play");
      if (window.StreamAds) StreamAds.attach(pl, document.getElementById("p"), { kids: Stream.isKids(), startAt: at });

      var base = "https://archive.org/download/" + encodeURIComponent(id) + "/";
      return Stream.dl.has(id).then(function (has) {
      if (has) { pl.load(Stream.dl.url(id), at); return; }
      if (m.file) { pl.load(base + m.file.split("/").map(encodeURIComponent).join("/"), at); return; }

      // No file listed in movies.json: ask the Internet Archive and pick the smallest normal video
      return fetch("https://archive.org/metadata/" + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (meta) {
        var vids = (meta.files || []).filter(function (f) {
          return /\.(mp4|m4v|webm)$/i.test(f.name) && +f.size > 15e6 && !/sample|trailer/i.test(f.name);
        }).sort(function (a, b) {
          return (a.source === "derivative" ? 0 : 1) - (b.source === "derivative" ? 0 : 1) || +a.size - +b.size;
        });
        if (!vids.length) { pl.say("This film has no playable file yet."); return; }
        pl.load(base + vids[0].name.split("/").map(encodeURIComponent).join("/"), at);
      });
      });
    }).catch(function () { pl.say("Could not load this film. Check your connection."); });
  })();
  </script>
  <script type="module" src="../guard.js"></script>
</body>
</html>
