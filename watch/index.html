<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Watch · str▶eam</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">
  <script>document.documentElement.classList.add("auth-wait");try{if(localStorage.getItem("stream-kids")==="1")document.documentElement.classList.add("kids")}catch(e){}setTimeout(function(){document.documentElement.classList.remove("auth-wait")},6000)</script>
  <link rel="icon" href="../favicon.ico" sizes="any">

</head>
<body class="watch">
  <div id="p"></div>

  <script src="../app.js"></script>
  <script src="../player.js"></script>
  <script>
  (function () {
    var id = new URLSearchParams(location.search).get("id"), curFilm = null;
    var pl = Player.mount(document.getElementById("p"), {
      full: true, fullscreenOnPlay: true, keys: true,
      back: "../movie/?id=" + encodeURIComponent(id || ""),
      onProgress: function (t, d) { Stream.save(id, t, d); },
      report: function () { Stream.reportDialog(curFilm ? curFilm.title : "this film", "Film: " + (curFilm ? curFilm.title : "") + "\nID: " + id); }
    });
    if (!id) { pl.say("No movie selected."); return; }

    Stream.movies().then(function (all) {
      var m = all.filter(function (x) { return x.id === id; })[0];
      if (!m) { pl.say("Film not found."); return; }
      document.title = m.title + " · str▶eam";
      pl.setTitle(m.title); curFilm = m;
      var pa = Stream.progress();
      var nxt = all.filter(function (x) { return x.id !== id && !(pa[x.id] && pa[x.id].d && pa[x.id].t > pa[x.id].d - 30); })
        .sort(function (a, b) { return (b.genre === m.genre ? 1 : 0) - (a.genre === m.genre ? 1 : 0); })[0];
      pl.video.addEventListener("ended", function () {
        if (pl.video.duration) Stream.save(id, pl.video.duration, pl.video.duration);
        if (!nxt) return;
        var box = document.createElement("div"); box.className = "upnext glass";
        box.appendChild(Stream.poster(nxt, "un-poster"));
        var info = document.createElement("div"); info.className = "un-info";
        var s1 = document.createElement("small"); s1.textContent = "Up next";
        var b = document.createElement("b"); b.textContent = nxt.title;
        var row = document.createElement("div"); row.className = "un-row";
        var play = document.createElement("a"); play.className = "btn sm"; play.textContent = "Play now"; play.href = Stream.watchUrl(nxt.id);
        var cl = document.createElement("button"); cl.type = "button"; cl.className = "btn sm ghost"; cl.textContent = "Close"; cl.onclick = function () { if (box.parentNode) box.parentNode.removeChild(box); };
        row.appendChild(play); row.appendChild(cl); info.appendChild(s1); info.appendChild(b); info.appendChild(row); box.appendChild(info);
        document.getElementById("p").appendChild(box);
      });
      pl.poster(Stream.thumb(id));
      var s = Stream.progress()[id], at = s && s.t > 5 && s.t < s.d - 30 ? s.t : 0;
      pl.setStart(at ? "Resume from " + Player.fmt(at) : "Tap to play");

      var base = "https://archive.org/download/" + encodeURIComponent(id) + "/";
      return Stream.dl.has(id).then(function (has) {
      if (has) { pl.load(Stream.dl.url(id), at); return; }
      if (m.file) { pl.load(base + m.file.split("/").map(encodeURIComponent).join("/"), at); return; }

      // No file listed in movies.json: ask the Internet Archive and pick the smallest normal video
      return fetch("https://archive.org/metadata/" + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (meta) {
        var vids = (meta.files || []).filter(function (f) {
          return /\.(mp4|m4v|webm)$/i.test(f.name) && +f.size > 15e6 && !/sample|trailer/i.test(f.name);
        }).sort(function (a, b) {
          return (a.source === "derivative" ? 0 : 1) - (b.source === "derivative" ? 0 : 1) || +a.size - +b.size;
        });
        if (!vids.length) { pl.say("This film has no playable file yet."); return; }
        pl.load(base + vids[0].name.split("/").map(encodeURIComponent).join("/"), at);
      });
      });
    }).catch(function () { pl.say("Could not load this film. Check your connection."); });
  })();
  </script>

  <script src="../app.js"></script>
  <script src="../player.js"></script>
  <script>
  (function () {
    var id = new URLSearchParams(location.search).get("id"), curFilm = null;
    var mountEl = document.getElementById("p");
    var pl = Player.mount(mountEl, {
      full: true, fullscreenOnPlay: true, keys: true,
      back: "../movie/?id=" + encodeURIComponent(id || ""),
      onProgress: function (t, d) { Stream.save(id, t, d); },
      report: function () { Stream.reportDialog(curFilm ? curFilm.title : "this film", "Film: " + (curFilm ? curFilm.title : "") + "\nID: " + id); }
    });
    if (!id) { pl.say("No movie selected."); return; }

    var CAMPAIGNS = [
      {
        id: "quicktokengen",
        type: "card",
        src: "../Picsart_26-10-29_06-47-08-346.jpg",
        url: "https://quicktokengen.dev/?utm_source=watchstream&utm_medium=preroll&utm_campaign=quicktokengen",
        label: "Sponsored · QuickTokenGen",
        cta: "Open Tool",
        totalSec: 15,
        skipAfterSec: 5,
        genres: null,
        movieIds: null
      }
      // Add more sponsors here, e.g.:
      // {
      //   id: "sponsor-two",
      //   type: "video", // "card" or "video"
      //   src: "https://archive.org/download/YOUR_ITEM/promo.mp4",
      //   url: "https://example.com/?utm_source=watchstream&utm_medium=preroll",
      //   label: "Sponsored · Brand Name",
      //   cta: "Learn More",
      //   totalSec: 15,
      //   skipAfterSec: 5,
      //   genres: ["Horror", "Sci-Fi"],
      //   movieIds: null
      // }
    ];

    function isKidsMode() {
      return document.documentElement.classList.contains("kids") ||
        localStorage.getItem("stream-kids") === "1" ||
        (typeof Stream !== "undefined" && typeof Stream.isKids === "function" && Stream.isKids());
    }

    function pickCampaign(film) {
      if (!CAMPAIGNS.length) return null;
      var g = film && film.genre ? String(film.genre).toLowerCase() : "";
      var mid = film && film.id ? String(film.id) : "";

      var targeted = CAMPAIGNS.filter(function (c) {
        var matchMovie = Array.isArray(c.movieIds) && c.movieIds.indexOf(mid) !== -1;
        var matchGenre = Array.isArray(c.genres) && g && c.genres.some(function (x) {
          return String(x).toLowerCase() === g;
        });
        return matchMovie || matchGenre;
      });

      var pool = targeted.length ? targeted : CAMPAIGNS.filter(function (c) {
        return !c.genres && !c.movieIds;
      });
      if (!pool.length) pool = CAMPAIGNS;

      var idx = 0;
      try {
        idx = parseInt(localStorage.getItem("stream-ad-idx") || "0", 10) || 0;
        localStorage.setItem("stream-ad-idx", String((idx + 1) % 1000000));
      } catch (e) {}

      return pool[idx % pool.length];
    }

    function runPreRoll(film, onDone) {
      if (isKidsMode()) { onDone(); return; }
      var ad = pickCampaign(film);
      if (!ad) { onDone(); return; }

      try {
        if (pl.video && typeof pl.video.pause === "function") pl.video.pause();
      } catch (e) {}

      var ov = document.createElement("div");
      ov.className = "ad-ov";

      var mediaHtml = ad.type === "video"
        ? '<video src="' + ad.src + '" autoplay playsinline muted style="width:100%;max-height:58vh;display:block;background:#000;"></video>'
        : '<a href="' + ad.url + '" target="_blank" rel="noopener noreferrer" aria-label="' + ad.label + '">' +
            '<img src="' + ad.src + '" alt="' + ad.label + '">' +
          '</a>';

      ov.innerHTML =
        '<div class="ad-card">' +
          mediaHtml +
          '<div class="ad-bar">' +
            '<span class="ad-tag" id="ad-status">' + ad.label + ' · ' + ad.totalSec + 's</span>' +
            '<div class="ad-actions">' +
              '<a class="btn sm" href="' + ad.url + '" target="_blank" rel="noopener noreferrer">' + (ad.cta || "Visit") + '</a>' +
              '<button type="button" class="ad-skip" id="ad-skip" disabled>Skip in ' + ad.skipAfterSec + 's</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      mountEl.appendChild(ov);

      var skipBtn = ov.querySelector("#ad-skip");
      var statusEl = ov.querySelector("#ad-status");
      var elapsed = 0;
      var closed = false;

      function finish() {
        if (closed) return;
        closed = true;
        clearInterval(timer);
        if (ov.parentNode) ov.parentNode.removeChild(ov);
        onDone();
      }

      var timer = setInterval(function () {
        elapsed += 1;
        var left = Math.max(0, ad.totalSec - elapsed);
        var skipLeft = Math.max(0, ad.skipAfterSec - elapsed);

        statusEl.textContent = ad.label + " · " + left + "s";

        if (skipLeft > 0) {
          skipBtn.textContent = "Skip in " + skipLeft + "s";
        } else if (skipBtn.disabled) {
          skipBtn.disabled = false;
          skipBtn.classList.add("ready");
          skipBtn.textContent = "Skip Ad ›";
        }

        if (elapsed >= ad.totalSec) {
          finish();
        }
      }, 1000);

      skipBtn.addEventListener("click", function () {
        if (!skipBtn.disabled) finish();
      });
    }

    Stream.movies().then(function (all) {
      var m = all.filter(function (x) { return x.id === id; })[0];
      if (!m) { pl.say("Film not found."); return; }
      document.title = m.title + " · str▶eam";
      pl.setTitle(m.title); curFilm = m;
      var pa = Stream.progress();
      var nxt = all.filter(function (x) { return x.id !== id && !(pa[x.id] && pa[x.id].d && pa[x.id].t > pa[x.id].d - 30); })
        .sort(function (a, b) { return (b.genre === m.genre ? 1 : 0) - (a.genre === m.genre ? 1 : 0); })[0];
      pl.video.addEventListener("ended", function () {
        if (pl.video.duration) Stream.save(id, pl.video.duration, pl.video.duration);
        if (!nxt) return;
        var box = document.createElement("div"); box.className = "upnext glass";
        box.appendChild(Stream.poster(nxt, "un-poster"));
        var info = document.createElement("div"); info.className = "un-info";
        var s1 = document.createElement("small"); s1.textContent = "Up next";
        var b = document.createElement("b"); b.textContent = nxt.title;
        var row = document.createElement("div"); row.className = "un-row";
        var play = document.createElement("a"); play.className = "btn sm"; play.textContent = "Play now"; play.href = Stream.watchUrl(nxt.id);
        var cl = document.createElement("button"); cl.type = "button"; cl.className = "btn sm ghost"; cl.textContent = "Close"; cl.onclick = function () { if (box.parentNode) box.parentNode.removeChild(box); };
        row.appendChild(play); row.appendChild(cl); info.appendChild(s1); info.appendChild(b); info.appendChild(row); box.appendChild(info);
        mountEl.appendChild(box);
      });
      pl.poster(Stream.thumb(id));
      var s = Stream.progress()[id], at = s && s.t > 5 && s.t < s.d - 30 ? s.t : 0;
      pl.setStart(at ? "Resume from " + Player.fmt(at) : "Tap to play");

      function startStreamLoad() {
        var base = "https://archive.org/download/" + encodeURIComponent(id) + "/";
        return Stream.dl.has(id).then(function (has) {
          if (has) { pl.load(Stream.dl.url(id), at); return; }
          if (m.file) { pl.load(base + m.file.split("/").map(encodeURIComponent).join("/"), at); return; }

          return fetch("https://archive.org/metadata/" + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (meta) {
            var vids = (meta.files || []).filter(function (f) {
              return /\.(mp4|m4v|webm)$/i.test(f.name) && +f.size > 15e6 && !/sample|trailer/i.test(f.name);
            }).sort(function (a, b) {
              return (a.source === "derivative" ? 0 : 1) - (b.source === "derivative" ? 0 : 1) || +a.size - +b.size;
            });
            if (!vids.length) { pl.say("This film has no playable file yet."); return; }
            pl.load(base + vids[0].name.split("/").map(encodeURIComponent).join("/"), at);
          });
        });
      }

      runPreRoll(m, startStreamLoad);
    }).catch(function () { pl.say("Could not load this film. Check your connection."); });
  })();
  </script>
  <script type="module" src="../guard.js"></script>
</body>
</html>
