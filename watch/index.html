<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Watch · str▶eam</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="watch">
  <div id="p"></div>

  <script src="../app.js"></script>
  <script src="../player.js"></script>
  <script>
  (function () {
    var id = new URLSearchParams(location.search).get("id");
    var pl = Player.mount(document.getElementById("p"), {
      full: true, fullscreenOnPlay: true, keys: true,
      back: "../movie/?id=" + encodeURIComponent(id || ""),
      onProgress: function (t, d) { Stream.save(id, t, d); }
    });
    if (!id) { pl.say("No movie selected."); return; }

    Stream.movies().then(function (all) {
      var m = all.filter(function (x) { return x.id === id; })[0];
      if (!m) { pl.say("Film not found."); return; }
      document.title = m.title + " · str▶eam";
      pl.setTitle(m.title);
      pl.poster(Stream.thumb(id));
      var s = Stream.progress()[id], at = s && s.t > 5 && s.t < s.d - 30 ? s.t : 0;
      pl.setStart(at ? "Resume from " + Player.fmt(at) : "Tap to play");

      var base = "https://archive.org/download/" + encodeURIComponent(id) + "/";
      if (m.file) { pl.load(base + m.file.split("/").map(encodeURIComponent).join("/"), at); return; }

      // No file listed in movies.json: ask the Internet Archive and pick the smallest normal video
      return fetch("https://archive.org/metadata/" + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (meta) {
        var vids = (meta.files || []).filter(function (f) {
          return /\.(mp4|m4v|webm)$/i.test(f.name) && +f.size > 15e6 && !/sample|trailer/i.test(f.name);
        }).sort(function (a, b) {
          return (a.source === "derivative" ? 0 : 1) - (b.source === "derivative" ? 0 : 1) || +a.size - +b.size;
        });
        if (!vids.length) { pl.say("This film has no playable file yet."); return; }
        pl.load(base + vids[0].name.split("/").map(encodeURIComponent).join("/"), at);
      });
    }).catch(function () { pl.say("Could not load this film. Check your connection."); });
  })();
  </script>
</body>
</html>
