<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a22">
  <title>Page not found · str▶eam</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      font-family: "Segoe UI", Roboto, system-ui, -apple-system, sans-serif; color: #eaf0ff;
      background: radial-gradient(900px 500px at 85% -5%, rgba(29,63,216,.55), transparent 70%), radial-gradient(700px 500px at -10% 40%, rgba(91,125,255,.22), transparent 70%), #040a22; }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: .02em; margin-bottom: 26px; }
    .logo span { color: #5b7dff; font-size: .85em; }
    .code { font-size: clamp(4.5rem, 24vw, 8rem); font-weight: 800; line-height: 1; background: linear-gradient(180deg, #8fa6ff, #1d3fd8); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 1.5rem; margin: 10px 0 8px; }
    p { color: #94a3d9; max-width: 34ch; margin: 0 auto 26px; line-height: 1.5; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-block; padding: 13px 28px; border-radius: 999px; font: inherit; font-weight: 700; color: #fff; text-decoration: none; cursor: pointer;
      background: linear-gradient(180deg, #7f98ff, #1d3fd8); border: 1px solid rgba(255,255,255,.35); box-shadow: 0 8px 22px rgba(29,63,216,.5); }
    .btn.ghost { background: rgba(20,40,120,.38); box-shadow: none; border-color: rgba(150,175,255,.28); }
    .small { margin-top: 26px; font-size: .9rem; }
    .small a { color: #5b7dff; }
  </style>
</head>
<body>
  <main>
    <div class="logo">str<span>▶</span>eam</div>
    <div class="code">404</div>
    <h1>This page can't be found</h1>
    <p>The page you're looking for doesn't exist, or it has moved.</p>
    <div class="row">
      <a class="btn" href="/">Go to Home</a>
      <button class="btn ghost" type="button" onclick="history.length > 1 ? history.back() : location.href = '/'">Go back</button>
    </div>
    <p class="small"><a href="/help/">Help Center</a></p>
  </main>
</body>
</html>
