<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a22">
  <title>Settings · str▶eam</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../style.css">
  <script>document.documentElement.classList.add("auth-wait");try{if(localStorage.getItem("stream-kids")==="1")document.documentElement.classList.add("kids")}catch(e){}setTimeout(function(){document.documentElement.classList.remove("auth-wait")},6000)</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../icons/icon-192.png" type="image/png" sizes="192x192">
</head>
<body>

  <nav class="nav glass" aria-label="Main">
    <a class="logo" href="../" aria-label="stream home">str<span>▶</span>eam</a>
    <ul>
      <li><a href="../"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a></li>
      <li><a href="../live/"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Live TV</a></li>
      <li>
        <a href="../downloads/">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></svg>
          Downloads
        </a>
      </li>
      <li><a href="../discover/"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a></li>
      <li><a href="../profile/" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</a></li>
    </ul>
  </nav>

  <main>
    <h1 class="page-title">Settings</h1>

    <section class="set-sec">
      <h2>Profile name</h2>
      <div class="field"><label for="sn">Name for <span id="sp"></span></label><input id="sn" type="text" maxlength="20" autocomplete="off"></div>
      <button class="btn" type="button" id="sv">Save name</button>
    </section>

    <section class="set-sec">
      <h2>Avatar</h2>
      <div class="pf-pick big" id="avpick" style="justify-content:flex-start"></div>
    </section>

    <section class="set-sec">
      <h2>Animation</h2>
      <label class="kids-toggle"><input type="checkbox" id="intro"> Play the opening animation</label>
    </section>

    <section class="set-sec hide-kids">
      <h2>Playback and downloads</h2>
      <label class="kids-toggle"><input type="checkbox" id="cc"> Turn captions on by default (when a channel provides them)</label>
      <label class="kids-toggle"><input type="checkbox" id="wf"> Download over Wi-Fi only (Android)</label>
    </section>

    <section class="set-sec hide-kids">
      <h2>Notifications</h2>
      <p class="empty">Push notifications are coming soon.</p>
    </section>

    <section class="set-sec hide-kids" id="privsec" hidden>
      <h2>Privacy</h2>
      <label class="kids-toggle"><input type="checkbox" id="an"> Share anonymous usage data (Google Analytics)</label>
    </section>

    <section class="set-sec hide-kids">
      <h2>Parent PIN</h2>
      <p class="empty" id="pinState"></p>
      <div class="acct-row"><button class="btn ghost" type="button" id="pinSet"></button><button class="btn ghost" type="button" id="pinOff" hidden>Remove PIN</button></div>
    </section>

    <section class="set-sec hide-kids">
      <h2>Your data</h2>
      <ul class="list">
        <li><button class="glass plain" type="button" id="ch">Clear watch history for this profile</button></li>
        <li><button class="glass plain" type="button" id="cl">Clear My List for this profile</button></li>
      </ul>
      <p class="empty" id="store"></p>
    </section>
  </main>

  <script src="../app.js"></script>
  <script>
  Stream.whenUser(function () {
    var P = Stream.profiles, cur = P.active(), $ = function (id) { return document.getElementById(id); };
    if (!cur) { Stream.profileSetup(); return; }
    $("sp").textContent = cur.name; $("sn").value = cur.name;
    $("sv").onclick = function () {
      var n = $("sn").value.trim();
      if (!n) { Stream.toast("Please enter a name"); return; }
      P.update(cur.id, { name: n }); $("sp").textContent = n; Stream.toast("Name saved");
    };
    function drawAv() {
      var box = $("avpick"); box.innerHTML = "";
      P.avatars.forEach(function (e, i) {
        var b = document.createElement("button"); b.type = "button"; b.textContent = e;
        b.setAttribute("aria-pressed", i === cur.a); b.setAttribute("aria-label", "Avatar " + (i + 1));
        b.onclick = function () { cur.a = i; P.update(cur.id, { a: i }); drawAv(); Stream.toast("Avatar updated"); };
        box.appendChild(b);
      });
    }
    drawAv();
    function flag(id, key) {
      $(id).checked = !!localStorage.getItem(key);
      $(id).onchange = function () { try { if (this.checked) localStorage.setItem(key, "1"); else localStorage.removeItem(key); } catch (e) {} };
    }
    flag("cc", "stream-cc-default"); flag("wf", "stream-wifi-only");
    function drawPin() {
      var on = Stream.pin.has();
      $("pinState").textContent = on ? "A PIN is on. Children need it to leave a kids profile." : "No PIN yet. A PIN stops children from leaving a kids profile.";
      $("pinSet").textContent = on ? "Change PIN" : "Set PIN"; $("pinOff").hidden = !on;
    }
    drawPin();
    $("pinSet").onclick = function () { if (Stream.pin.has()) Stream.pin.change(drawPin); else Stream.pin.setup(drawPin); };
    $("pinOff").onclick = function () { Stream.pin.remove(drawPin); };
    $("intro").checked = !localStorage.getItem("stream-intro-off");
    $("intro").onchange = function () { try { if (this.checked) localStorage.removeItem("stream-intro-off"); else localStorage.setItem("stream-intro-off", "1"); } catch (e) {} };
    $("ch").onclick = function () { if (confirm("Clear watch history for " + cur.name + "?")) { Stream.clearProgress(); Stream.toast("Watch history cleared"); } };
    $("cl").onclick = function () { if (confirm("Clear My List for " + cur.name + "?")) { Stream.clearList(); Stream.toast("My List cleared"); } };
    setTimeout(function () {
      if (!window.StreamAnalytics) return;
      $("privsec").hidden = false; $("an").checked = window.StreamAnalytics.get() === "yes";
      $("an").onchange = function () { window.StreamAnalytics.set(this.checked ? "yes" : "no"); Stream.toast(this.checked ? "Analytics on" : "Analytics off"); };
    }, 1500);
    if (window.caches) caches.keys().then(function (ks) {
      var v = ks.filter(function (k) { return /^stream-v/.test(k); })[0];
      var p = document.createElement("p"); p.className = "empty hide-kids"; p.style.fontSize = ".8rem";
      p.textContent = "App version: " + (v || "not installed yet"); document.querySelector("main").appendChild(p);
    });
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function (e) {
      $("store").textContent = "Storage used by stream on this device: " + Math.round((e.usage || 0) / 1048576) + " MB";
    });
  });
  </script>
  <script src="../pwa.js"></script>
  <script type="module" src="../guard.js"></script>
</body>
</html>
