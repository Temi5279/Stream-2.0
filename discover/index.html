<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a22">
  <title>Discover · str▶eam</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../style.css">
  <script>document.documentElement.classList.add("auth-wait");setTimeout(function(){document.documentElement.classList.remove("auth-wait")},6000)</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../icons/icon-192.png" type="image/png" sizes="192x192">
</head>
<body>

  <nav class="nav glass" aria-label="Main">
    <a class="logo" href="../" aria-label="stream home">str<span>▶</span>eam</a>
    <ul>
      <li><a href="../"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a></li>
      <li><a href="../live/"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Live TV</a></li>
      <li><a href="../discover/" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a></li>
      <li><a href="../profile/"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</a></li>
    </ul>
  </nav>

  <main>
    <h1 class="page-title">Discover</h1>
    <input class="search glass" id="q" type="search" placeholder="Search movies and series" aria-label="Search">
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="none" hidden>No films match your search.</p>
  </main>

  <script src="../app.js"></script>
  <script>
  Stream.guardOnline(function () { Stream.movies().then(function (all) {
    var genre = "All", q = document.getElementById("q"), grid = document.getElementById("grid"),
        chips = document.getElementById("chips"), none = document.getElementById("none");
    function draw() {
      var t = q.value.trim().toLowerCase();
      var list = all.filter(function (m) {
        return (genre === "All" || m.genre === genre) &&
          (!t || (m.title + " " + m.year + " " + m.genre + " " + m.description).toLowerCase().indexOf(t) > -1);
      });
      grid.innerHTML = ""; list.forEach(function (m) { grid.appendChild(Stream.card(m)); });
      none.hidden = list.length > 0;
    }
    ["All"].concat(all.map(function (m) { return m.genre; }).filter(function (g, i, a) { return a.indexOf(g) === i; }))
      .forEach(function (g) {
        var b = document.createElement("button");
        b.className = "chip glass"; b.textContent = g; b.setAttribute("aria-pressed", g === genre);
        b.onclick = function () {
          genre = g;
          Array.prototype.forEach.call(chips.children, function (c) { c.setAttribute("aria-pressed", c === b); });
          draw();
        };
        chips.appendChild(b);
      });
    q.addEventListener("input", draw);
    draw();
  }); });
  </script>
  <script src="../helper.js"></script>
  <script src="../pwa.js"></script>
  <script type="module" src="../guard.js"></script>
</body>
</html>
