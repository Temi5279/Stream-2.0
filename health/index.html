<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>stream health check</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../style.css">
  <style>
    .hc { max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; }
    .hc h1 { margin-bottom: 6px; } .hc h2 { margin: 26px 0 10px; font-size: 1.15rem; }
    .hc .sum { color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
    .hc .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .hc .btn { align-self: auto; }
    .hc ul { list-style: none; display: grid; gap: 6px; }
    .hc li { padding: 8px 12px; border-radius: 12px; font-size: .88rem; background: rgba(255,255,255,.06); word-break: break-word; }
    .hc li.bad { background: rgba(229,72,77,.18); } .hc li small { color: var(--muted); display: block; }
    .bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.2); overflow: hidden; margin: 8px 0; } .bar i { display: block; height: 100%; width: 0; background: var(--glow); transition: width .3s; }
    textarea { width: 100%; min-height: 90px; margin-top: 8px; border-radius: 12px; padding: 10px; font: .75rem monospace; color: var(--text); background: rgba(4,10,34,.6); border: 1px solid var(--glass-edge); }
  </style>
</head>
<body class="plain">
<main class="hc">
  <h1>Health check</h1>
  <p class="sum">Tests that every file is in place, then tries to play every film and channel from <em>this</em> phone and connection. Use Wi-Fi. Channels that only work in other countries may show as failing here.</p>

  <h2>1. Files</h2>
  <div class="row"><button class="btn sm" id="runFiles" type="button">Check files</button></div>
  <p class="sum" id="fSum"></p><ul id="fList"></ul>

  <h2>2. Films</h2>
  <div class="row"><button class="btn sm" id="runFilms" type="button">Test 20 films</button><button class="btn sm ghost" id="runFilmsAll" type="button">Test all films</button></div>
  <div class="bar"><i id="mBar"></i></div><p class="sum" id="mSum"></p><ul id="mList"></ul>
  <div class="row"><button class="btn sm ghost" id="copyFilms" type="button" hidden>Copy working films (movies.json)</button></div>

  <h2>3. Live channels</h2>
  <div class="row"><button class="btn sm" id="runCh" type="button">Test all channels</button></div>
  <div class="bar"><i id="cBar"></i></div><p class="sum" id="cSum"></p><ul id="cList"></ul>
  <div class="row"><button class="btn sm ghost" id="copyCh" type="button" hidden>Copy working channels (channels.json)</button></div>
  <textarea id="out" hidden readonly></textarea>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function li(ok, text, note) { var e = document.createElement("li"); if (!ok) e.className = "bad"; e.textContent = (ok ? "✅ " : "❌ ") + text; if (note) { var s = document.createElement("small"); s.textContent = note; e.appendChild(s); } return e; }
  function pool(items, n, worker, tick) {
    var i = 0, done = 0;
    return new Promise(function (res) {
      function next() { if (i >= items.length) { if (done >= items.length) res(); return; } var k = i++; worker(items[k], k).then(function () { done++; tick(done); next(); }); }
      for (var j = 0; j < n; j++) next();
      if (!items.length) res();
    });
  }

  // ---- 1. files ----
  var FILES = ["index.html", "welcome/", "signin/", "signup/", "profile/", "profiles/", "settings/", "account/", "downloads/", "live/", "discover/", "movie/", "watch/", "help/", "privacy/", "terms/", "cookies/", "legal/", "trailer/", "404.html",
    "manifest.json", "sw.js", "app.js", "guard.js", "sync.js", "firebase.js", "player.js", "helper.js", "pwa.js", "analytics.js", "intro.js", "tvnav.js", "style.css", "movies.json", "channels.json", "epg.json", "favicon.ico", "og.png", "icons/icon-192.png", "icons/icon-512.png"];
  $("runFiles").onclick = function () {
    var ul = $("fList"); ul.innerHTML = ""; var bad = 0;
    pool(FILES, 5, function (f) {
      return fetch("../" + f + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) { bad++; ul.insertBefore(li(false, f, "status " + r.status), ul.firstChild); } }, function () { bad++; ul.insertBefore(li(false, f, "could not load"), ul.firstChild); });
    }, function (d) { $("fSum").textContent = d + " of " + FILES.length + " checked, " + bad + " missing"; }).then(function () {
      $("fSum").textContent = bad ? bad + " file(s) missing or broken. Upload them and test again." : "All " + FILES.length + " files are in place. ✅";
    });
  };

  // ---- 2. films ----
  var films = [], filmOk = {};
  function fileFor(m) {
    if (m.file) return Promise.resolve(m.file);
    return fetch("https://archive.org/metadata/" + encodeURIComponent(m.id)).then(function (r) { return r.json(); }).then(function (meta) {
      var v = (meta.files || []).filter(function (f) { return /\.(mp4|m4v)$/i.test(f.name) && +f.size > 15e6 && !/sample|trailer/i.test(f.name); }).sort(function (a, b) { return (a.source === "derivative" ? 0 : 1) - (b.source === "derivative" ? 0 : 1) || +a.size - +b.size; });
      if (!v.length) throw new Error("no video file listed"); return v[0].name;
    });
  }
  function testFilm(m) {
    return fileFor(m).then(function (f) {
      return new Promise(function (res) {
        var v = document.createElement("video"), done = false, t;
        function end(ok, why) { if (done) return; done = true; clearTimeout(t); v.removeAttribute("src"); v.load(); res({ ok: ok, why: why }); }
        v.preload = "metadata"; v.muted = true;
        v.onloadedmetadata = function () { end(true); };
        v.onerror = function () { end(false, "the video would not load (error " + (v.error ? v.error.code : "?") + ")"); };
        t = setTimeout(function () { end(false, "took too long (slow or blocked)"); }, 15000);
        v.src = "https://archive.org/download/" + encodeURIComponent(m.id) + "/" + f.split("/").map(encodeURIComponent).join("/");
      });
    }, function (e) { return { ok: false, why: e.message || "no file" }; });
  }
  function runFilms(limit) {
    $("mList").innerHTML = ""; filmOk = {}; $("copyFilms").hidden = true;
    fetch("../movies.json?t=" + Date.now()).then(function (r) { return r.json(); }).then(function (all) {
      films = all; var list = limit ? all.slice(0, limit) : all, bad = 0;
      return pool(list, 3, function (m) { return testFilm(m).then(function (r) { filmOk[m.id] = r.ok; if (!r.ok) { bad++; $("mList").insertBefore(li(false, m.title + " (" + m.id + ")", r.why), $("mList").firstChild); } }); },
        function (d) { $("mBar").style.width = d / list.length * 100 + "%"; $("mSum").textContent = d + " of " + list.length + " tested, " + bad + " not working"; })
        .then(function () { $("mSum").textContent = (list.length - bad) + " of " + list.length + " films play. " + bad + " do not."; $("copyFilms").hidden = false; });
    }, function () { $("mSum").textContent = "Could not read movies.json"; });
  }
  $("runFilms").onclick = function () { runFilms(20); }; $("runFilmsAll").onclick = function () { runFilms(0); };
  $("copyFilms").onclick = function () {
    var keep = films.filter(function (m) { return filmOk[m.id] !== false; });
    show(JSON.stringify(keep, null, 2), "Working films (" + keep.length + "). Untested films are kept. Paste into movies.json on GitHub.");
  };

  // ---- 3. channels ----
  var chans = [], chOk = {};
  function testChan(c) {
    return new Promise(function (res) {
      var v = document.createElement("video"), done = false, hls = null, t;
      function end(ok, why) { if (done) return; done = true; clearTimeout(t); try { if (hls) hls.destroy(); } catch (e) {} v.removeAttribute("src"); res({ ok: ok, why: why }); }
      v.muted = true; t = setTimeout(function () { end(false, "no response in 12 seconds"); }, 12000);
      if (v.canPlayType("application/vnd.apple.mpegurl") && !window.Hls) { v.onloadedmetadata = function () { end(true); }; v.onerror = function () { end(false, "would not load"); }; v.src = c.src; return; }
      if (!window.Hls || !Hls.isSupported()) { end(false, "this browser can't play HLS"); return; }
      hls = new Hls();
      hls.on(Hls.Events.FRAG_LOADED, function () { end(true); });
      hls.on(Hls.Events.ERROR, function (e, d) { if (d.fatal) end(false, d.details || d.type); });
      hls.loadSource(c.src); hls.attachMedia(v);
    });
  }
  $("runCh").onclick = function () {
    $("cList").innerHTML = ""; chOk = {}; $("copyCh").hidden = true;
    fetch("../channels.json?t=" + Date.now()).then(function (r) { return r.json(); }).then(function (all) {
      chans = all; var bad = 0;
      return pool(all, 4, function (c) { return testChan(c).then(function (r) { chOk[c.id] = r.ok; if (!r.ok) { bad++; $("cList").insertBefore(li(false, c.name + " (" + c.category + ")", r.why), $("cList").firstChild); } }); },
        function (d) { $("cBar").style.width = d / all.length * 100 + "%"; $("cSum").textContent = d + " of " + all.length + " tested, " + bad + " not working"; })
        .then(function () { $("cSum").textContent = (all.length - bad) + " of " + all.length + " channels work from here. " + bad + " do not. (Some may work in the USA or Europe.)"; $("copyCh").hidden = false; });
    }, function () { $("cSum").textContent = "Could not read channels.json"; });
  };
  $("copyCh").onclick = function () {
    var keep = chans.filter(function (c) { return chOk[c.id] !== false; });
    show(JSON.stringify(keep, null, 1), "Working channels (" + keep.length + "). Paste into channels.json on GitHub.");
  };

  function show(text, note) {
    var o = $("out"); o.hidden = false; o.value = text; o.focus(); o.select();
    try { document.execCommand("copy"); alert(note + " It is selected and copied."); } catch (e) { alert(note + " Long-press the box and tap Copy."); }
  }
})();
</script>
</body>
</html>
