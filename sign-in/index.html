<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign In – Stream</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: var(--bg-deep);
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      border-radius: 20px;
    }

    .auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .auth-logo img {
      height: 48px;
      width: auto;
    }

    .auth-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--royal);
    }

    .forgot {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot a {
      color: var(--royal-light);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .btn-full {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--royal);
      color: white;
    }

    .btn-google, .btn-phone {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .switch-auth {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .switch-auth a {
      color: var(--royal-light);
      text-decoration: none;
      font-weight: 500;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card diamond-glass">
    <div class="auth-logo">
      <img src="../icon-512.png" alt="Stream" />
    </div>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue watching</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <div class="forgot">
        <a href="#" id="forgotPassword">Forgot password?</a>
      </div>

      <button type="submit" class="btn-full btn-primary">Sign In</button>
    </form>

    <div class="divider">or</div>

    <button class="btn-full btn-google" id="googleBtn">
      <i class="fa-brands fa-google"></i>
      Continue with Google
    </button>

    <button class="btn-full btn-phone" id="phoneBtn">
      <i class="fa-solid fa-phone"></i>
      Continue with Phone
    </button>

    <div class="switch-auth">
      Don’t have an account? <a href="../sign-up/">Sign up</a>
    </div>
  </div>

  <script type="module">
    import { auth } from '../firebase-config.js';
    import { 
      signInWithEmailAndPassword, 
      sendPasswordResetEmail,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = '../index.html';
      }
    });

    const errorMsg = document.getElementById('errorMsg');

    function showError(message) {
      errorMsg.style.display = 'block';
      errorMsg.textContent = message;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = '../index.html';
      } catch (error) {
        showError(error.message);
      }
    });

    document.getElementById('forgotPassword').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;

      if (!email) {
        showError("Please enter your email first");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        alert("Password reset email sent! Check your inbox.");
      } catch (error) {
        showError(error.message);
      }
    });

    document.getElementById('googleBtn').addEventListener('click', async () => {
      const provider = new GoogleAuthProvider();
      try {
        await signInWithPopup(auth, provider);
        window.location.href = '../index.html';
      } catch (error) {
        showError(error.message);
      }
    });

    document.getElementById('phoneBtn').addEventListener('click', () => {
      alert("Phone login coming soon.");
    });
  </script>

</body>
</html>
