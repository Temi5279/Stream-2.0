        .status-dot { width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #ff3b30; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }

        .station-grid { display: flex; gap: 15px; padding: 10px 30px 20px 30px; overflow-x: auto; scrollbar-width: none; }
        .station-grid::-webkit-scrollbar { display: none; }

            min-width: 170px;

            .player-stage { height: 60vh; }
            .channel-billboard { padding: 20px 60px; }
            .row-title { padding-left: 60px; font-size: 1.4em; }
            .station-grid { padding: 10px 60px 30px 60px; gap: 20px; }
            .station-card { min-width: 220px; height: 120px; }
            .guide-section { padding: 10px 60px 60px 60px; }
        }

        const video = document.getElementById('videoPlayer');

        // HIGH PERFORMANCE VIDEO STREAMING LOGIC PIPELINE
        function playStream(station) {
            document.getElementById('currentPlayerTitle').innerText = station.name;
            updateScheduleGuide(station);

            if (Hls.isSupported()) {
                hls.destroy(); 
                hls = new Hls();
                hls.loadSource(station.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(e => console.log("Autoplay wait")); });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = station.url;
                video.addEventListener('loadedmetadata', () => { video.play(); });
            }
        }

        // DYNAMIC SCHEDULE GUIDE ENGINE
        function updateScheduleGuide(station) {
            document.getElementById('guideHeaderTitle').innerText = `${station.name} — Program Schedule`;
            const wrapper = document.getElementById('guideRowsWrapper');
            wrapper.innerHTML = '';

            station.schedule.forEach((show, index) => {
                const row = document.createElement('div');
                // First show in list gets highlighted as "Live Now" style block
                row.className = `guide-row ${index === 0 ? 'current-active' : ''}`;
                
                row.innerHTML = `
                    <div class="guide-time">${index === 0 ? '● NOW' : show.time}</div>
                    <div class="guide-details">
                        <div class="guide-show-title">${show.title}</div>
                        <div class="guide-show-desc">${show.desc}</div>
                    </div>
                `;
                wrapper.appendChild(row);
            });
        }

                card.innerHTML = `<div class="station-name">${station.name}</div>`;

                card.addEventListener('click', () => {
                    playStream(station);
                });

                container.appendChild(card);
            });
        }
