<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>str▶eam - Live TV</title>
    <style>
        :root { 
            --brand-blue: #0064ff; 
            --bg-dark: #040714; 
            --glass: rgba(255, 255, 255, 0.15); 
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-dark); 
            color: white; 
            margin: 0; 
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* REMOTE FOCUS STYLE */
        :focus { 
            outline: none; 
            border: 3px solid var(--brand-blue) !important; 
            transform: scale(1.03); 
            box-shadow: 0 0 25px var(--brand-blue); 
            z-index: 10; 
            background: rgba(0, 100, 255, 0.2); 
        }

        /* NAVIGATION CONTAINER */
        .nav-container { 
            background: rgba(4, 7, 20, 0.9); 
            backdrop-filter: blur(20px); 
            z-index: 1000; 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex;
            transition: all 0.3s ease;
        }

        .nav-link { 
            color: rgba(255,255,255,0.5); 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            transition: 0.3s; 
            border-radius: 10px; 
            padding: 8px; 
        }
        
        .nav-link.active { 
            color: var(--brand-blue); 
            text-shadow: 0 0 10px var(--brand-blue); 
        }
        
        .icon { width: 24px; height: 24px; fill: currentColor; }
        .tv-logo { display: none; } 

        /* MAIN LAYOUT WRAPPER */
        .main-layout {
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* IMMERSIVE LIVE STREAM STAGE CONTAINER */
        .player-stage {
            width: 100%;
            height: 50vh;
            background: #000;
            position: relative;
        }

        .player-stage iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .channel-billboard {
            padding: 15px 30px;
            background: linear-gradient(to bottom, rgba(4,7,20,0), var(--bg-dark));
        }

        .channel-title { font-size: 1.8em; margin: 0; font-weight: 800; }
        .channel-status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85em; color: #ff3b30; font-weight: bold; text-transform: uppercase; margin-top: 5px;}
        .status-dot { width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #ff3b30; }

        /* HORIZONTAL LIVE TRACK STATION MATRIX */
        .row-title { padding-left: 30px; font-size: 1.3em; margin-top: 25px; font-weight: 700; color: rgba(255,255,255,0.8); }
        .station-grid { display: flex; gap: 20px; padding: 10px 30px 40px 30px; overflow-x: auto; scrollbar-width: none; }
        .station-grid::-webkit-scrollbar { display: none; }

        .station-card {
            min-width: 180px;
            height: 100px;
            background: var(--glass);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.05);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .station-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1;
        }

        .station-name { font-weight: bold; font-size: 0.95em; position: relative; z-index: 2; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* =======================================================
           1. MOBILE / PHONE MATRIX STYLES
           ======================================================= */
        @media (max-width: 599px) {
            .nav-container { 
                position: fixed; 
                bottom: 0; 
                left: 0; 
                right: 0; 
                justify-content: space-around; 
                padding: 10px 0; 
                border-radius: 20px 20px 0 0; 
            }
            .main-layout { padding-bottom: 90px; }
            .player-stage { height: 30vh; }
        }

        /* =======================================================
           2. LAPTOP MATRIX STYLES (Sidebar view)
           ======================================================= */
        @media (min-width: 600px) and (max-width: 1024px) {
            body { flex-direction: row; }
            
            .nav-container {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                width: 90px;
                flex-direction: column;
                justify-content: center;
                gap: 35px;
                padding: 0 10px;
                border-radius: 0 20px 20px 0;
            }

            .main-layout { margin-left: 110px; }
            .player-stage { height: 45vh; }
        }

        /* =======================================================
           3. TV BOX MATRIX STYLES (Top Bar layout)
           ======================================================= */
        @media (min-width: 1025px) {
            .nav-container { 
                position: fixed; 
                top: 20px; 
                left: 50%;
                transform: translateX(-50%);
                width: fit-content; 
                border-radius: 50px; 
                padding: 12px 40px; 
                gap: 40px; 
            }
            
            .tv-logo { 
                display: block;
                position: fixed; 
                bottom: 40px; right: 50px; 
                font-size: 2.5em; 
                color: var(--brand-blue); 
                font-weight: bold; 
                z-index: 1000;
            }

            .main-layout { margin-top: 0px; }
            .player-stage { height: 65vh; }
            .channel-billboard { padding: 25px 60px; }
            .row-title { padding-left: 60px; font-size: 1.5em; }
            .station-grid { padding: 15px 60px 50px 60px; gap: 25px; }
            .station-card { min-width: 240px; height: 135px; }
        }
    </style>
</head>
<body>

    <div class="tv-logo">str▶eam</div>

    <nav class="nav-container">
        <a href="stream-home.html" class="nav-link" tabindex="1"><svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="live-tv.html" class="nav-link active" tabindex="2"><svg class="icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg><span>Live TV</span></a>
        <a href="discover.html" class="nav-link" tabindex="3"><svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Discover</span></a>
        <a href="profile.html" class="nav-link" tabindex="4"><svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></a>
    </nav>

    <div class="main-layout">
        <div class="player-stage">
            <iframe id="livePlayer" src="https://www.youtube.com/embed/live_stream?channel=UC4i9_bOsnN-O9o3R2_BlyHA&autoplay=1&mute=1" allow="autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <div class="channel-billboard">
            <div class="channel-status"><span class="status-dot"></span> Live broadcast feed</div>
            <h1 class="channel-title" id="currentPlayerTitle">FIFA+ Live Stream</h1>
        </div>

        <h2 class="row-title">Sports Channels</h2>
        <div class="station-grid" id="sportsContainer"></div>

        <h2 class="row-title">Global News Networks</h2>
        <div class="station-grid" id="newsContainer"></div>
    </div>

    <script>
        // LIVE FEED STATION MAP
        const stations = {
            sports: [
                { name: "FIFA+ On-Air", channelId: "UC4i9_bOsnN-O9o3R2_BlyHA", fallbackVideo: "bX44V97bXbI", bg: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=400&q=80" },
                { name: "Olympics Channel", channelId: "UC9x7N9M4M4qA1W2h6d8e2_w", fallbackVideo: "60_S6q9gHxk", bg: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=400&q=80" },
                { name: "Red Bull TV", channelId: "UCblfuW_4rakhd2g9qqY60kg", fallbackVideo: "5gR-vW3p_F0", bg: "https://images.unsplash.com/photo-1533105079780-92b9be482077?w=400&q=80" },
                { name: "World Billiards Live", channelId: "UCp_y84EwZ77b-H5R4K6hI0Q", fallbackVideo: "I_rF-ZAnz6s", bg: "https://images.unsplash.com/photo-1544698310-74ea9d1c8258?w=400&q=80" },
                { name: "World Poker Tour TV", channelId: "UCvX6HscE-D7b4XUvS0d_2uA", fallbackVideo: "LpW6YF4w-OQ", bg: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&q=80" }
            ],
            news: [
                { name: "DW News Live", channelId: "UCknLrEdhRCp1aegoKJS74XA", fallbackVideo: "v39c8gW5c4E", bg: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=400&q=80" },
                { name: "Sky News Live", channelId: "UComdcy96kthjwZ9S9_n7LwQ", fallbackVideo: "9AuqeyvKN2A", bg: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=400&q=80" },
                { name: "Al Jazeera English", channelId: "UCNye-wNBqNL5ZzHSJ1rKp8Q", fallbackVideo: "-upS8XUvDZs", bg: "https://images.unsplash.com/photo-1495020689067-958852a6565d?w=400&q=80" },
                { name: "ABC News Live", channelId: "UCBi2mrWuN6vydAwvr7HQ_rg", fallbackVideo: "w_Ma8oQLmSM", bg: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=400&q=80" }
            ]
        };

        let currentTabIndex = 10;

        function loadCategory(data, containerId) {
            const container = document.getElementById(containerId);
            data.forEach((station) => {
                const card = document.createElement('div');
                card.className = 'station-card';
                card.tabIndex = currentTabIndex++;
                card.style.backgroundImage = `url(${station.bg})`;
                card.innerHTML = `<div class="station-name">${station.name}</div>`;

                // Interactive Click Pipeline to load stream engine channelId
                card.addEventListener('click', () => {
                    document.getElementById('currentPlayerTitle').innerText = station.name;
                    
                    // URL logic pointing to live syndication endpoints
                    const liveUrl = `https://www.youtube.com/embed/live_stream?channel=${station.channelId}&autoplay=1`;
                    document.getElementById('livePlayer').src = liveUrl;
                });

                container.appendChild(card);
            });
        }

        // Initialize Directories
        loadCategory(stations.sports, 'sportsContainer');
        loadCategory(stations.news, 'newsContainer');

        // KEYBOARD / REMOTE SELECTION INTERACTION ENGINE
        document.addEventListener('keydown', (e) => {
            const focusable = Array.from(document.querySelectorAll('a, .station-card'));
            let index = focusable.indexOf(document.activeElement);
            
            if (e.key === "ArrowRight") {
                index = (index + 1) % focusable.length;
                e.preventDefault();
            }
            if (e.key === "ArrowLeft") {
                index = (index - 1 + focusable.length) % focusable.length;
                e.preventDefault();
            }
            if (e.key === "ArrowDown") {
                index = (index + 5 < focusable.length) ? index + 5 : index;
                e.preventDefault();
            }
            if (e.key === "ArrowUp") {
                index = (index - 5 >= 0) ? index - 5 : index;
                e.preventDefault();
            }
            if (e.key === "Enter") {
                document.activeElement.click();
            }
            
            if(focusable[index]) {
                focusable[index].focus();
                focusable[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        });
    </script>
</body>
