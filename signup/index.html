<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a22">
  <title>Create account · str▶eam</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="plain">

  <div class="auth-wrap">
    <main class="auth-card glass">
      <a class="logo" href="../welcome/">str<span>▶</span>eam</a>
      <h1>Create your account</h1>
      <p class="sub">Free, and it only takes a minute.</p>

      <button class="btn-google" id="g" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google</button>
      <div class="divider">or sign up with email</div>

      <form id="f" novalidate>
        <div class="field"><label for="name">Full name</label><input id="name" type="text" autocomplete="name" required></div>
        <div class="field"><label for="dob">Date of birth</label><input id="dob" type="date" autocomplete="bday" required></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" required></div>
        <div class="field"><label for="pw">Password</label>
          <div class="pw"><input id="pw" type="password" autocomplete="new-password" minlength="6" required><button type="button" id="show">Show</button></div>
        </div>
        <p class="msg" id="msg" role="alert"></p>
        <button class="btn full" id="go" type="submit">Create account</button>
      </form>
      <p class="fine">By continuing you agree to our <a href="../terms/">Terms of Service</a> and <a href="../privacy/">Privacy Policy</a>.</p>
      <p class="auth-alt">Already have an account? <a href="../signin/">Sign in</a></p>
    </main>
  </div>

  <script type="module">
    import { auth, onAuthStateChanged, createUserWithEmailAndPassword, updateProfile, saveProfile, googleSignIn, friendlyError } from "../firebase.js";
    var $ = function (id) { return document.getElementById(id); };
    var busy = false;
    $("dob").max = new Date().toISOString().slice(0, 10);
    onAuthStateChanged(auth, function (u) {
      if (!u) return;
      if (!busy) location.replace("../");
      else setTimeout(function () { location.replace("../"); }, 3500); // safety net if anything below is slow
    });

    $("show").onclick = function () {
      var p = $("pw"); p.type = p.type === "password" ? "text" : "password"; this.textContent = p.type === "password" ? "Show" : "Hide";
    };
    function age(d) { var b = new Date(d), n = new Date(), a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; }
    function fail(t) { $("msg").className = "msg"; $("msg").textContent = t; busy = false; $("go").disabled = false; $("g").disabled = false; }

    $("f").addEventListener("submit", async function (e) {
      e.preventDefault();
      var name = $("name").value.trim(), dob = $("dob").value, email = $("email").value.trim(), pw = $("pw").value;
      if (!name) return fail("Please enter your name.");
      if (!dob) return fail("Please enter your date of birth.");
      if (age(dob) < 13) return fail("You must be at least 13 to create an account.");
      if (!email) return fail("Please enter your email.");
      if (pw.length < 6) return fail("Password must be at least 6 characters.");
      busy = true; $("go").disabled = true; $("msg").textContent = "";
      try {
        var cred = await createUserWithEmailAndPassword(auth, email, pw);
        await updateProfile(cred.user, { displayName: name });
        await saveProfile(cred.user, { name: name, dob: dob, createdAt: new Date().toISOString() });
        location.replace("../");
      } catch (err) { fail(friendlyError(err)); }
    });
    $("g").onclick = async function () {
      busy = true; $("g").disabled = true; $("msg").textContent = "";
      try { await googleSignIn(); location.replace("../"); } catch (err) { fail(friendlyError(err)); }
    };
  </script>
</body>
</html>
