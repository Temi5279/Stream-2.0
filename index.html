<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a22">
  <title>str▶eam</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add("auth-wait");setTimeout(function(){document.documentElement.classList.remove("auth-wait")},6000)</script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <meta name="description" content="Classic films and free live TV. Watch free on your phone, tablet, laptop and TV.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="stream">
  <meta property="og:title" content="stream · Classic films and free live TV">
  <meta property="og:description" content="Silent classics, golden-age horror, news, sports and more. Free to watch on your phone, tablet, laptop and TV.">
  <meta property="og:image" content="https://watchstream.app/og.png">
  <meta property="og:url" content="https://watchstream.app/">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <nav class="nav glass" aria-label="Main">
    <a class="logo" href="./" aria-label="stream home">str<span>▶</span>eam</a>
    <ul>
      <li>
        <a href="./" aria-current="page">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
          Home
        </a>
      </li>
      <li>
        <a href="live/">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>
          Live TV
        </a>
      </li>
      <li>
        <a href="downloads/">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></svg>
          Downloads
        </a>
      </li>
      <li>
        <a href="discover/">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
          Discover
        </a>
      </li>
      <li>
        <a href="profile/">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
          Profile
        </a>
      </li>
    </ul>
  </nav>

  <main>
    <div class="top">
      <a class="logo" href="./">str<span>▶</span>eam</a>
    </div>

    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Classic films, free to watch</h1>
      <p>Silent films, old cartoons and golden-age movies, all in one place.</p>
      <a class="btn" href="discover/">Start watching</a>
    </section>

    <section class="row" id="cwrow" aria-labelledby="r1" hidden>
      <h2 id="r1">Continue watching</h2>
      <div class="cards" id="cw"></div>
    </section>

    <section class="row" id="mlrow" aria-labelledby="ml1" hidden>
      <h2 id="ml1">My List</h2>
      <div class="cards" id="mlist"></div>
    </section>

    <div id="rows"></div>
  </main>

  <script src="app.js"></script>
  <script>
  Stream.guardOnline(function () { Stream.whenUser(function () {
    var prof = Stream.profiles.active(), top = document.querySelector(".top");
    if (prof && top) {
      var pa = document.createElement("a"); pa.href = "profile/"; pa.setAttribute("aria-label", "Profile");
      pa.appendChild(Stream.profiles.avatar(prof, "sm")); top.appendChild(pa);
    }
    Stream.movies().then(function (all) {
      var prog = Stream.progress(), byId = {}, rows = document.getElementById("rows");
      all.forEach(function (m, i) { m._i = i; byId[m.id] = m; });
      function addRow(title, list) {
        if (!list.length) return;
        var sec = document.createElement("section"); sec.className = "row";
        var h2 = document.createElement("h2"); h2.textContent = title; sec.appendChild(h2);
        var box = document.createElement("div"); box.className = "cards";
        list.forEach(function (m) { box.appendChild(Stream.card(m)); });
        sec.appendChild(box); rows.appendChild(sec);
      }
      var watched = Object.keys(prog).filter(function (id) { return byId[id] && prog[id].t > 5; })
        .sort(function (a, b) { return prog[b].ts - prog[a].ts; });
      var cw = document.getElementById("cw");
      watched.filter(function (id) { return prog[id].t < prog[id].d - 30; }).forEach(function (id) {
        cw.appendChild(Stream.card(byId[id], Math.round(prog[id].t / prog[id].d * 100)));
      });
      if (cw.children.length) document.getElementById("cwrow").hidden = false;

      var ml = document.getElementById("mlist");
      Stream.mylist.ids().forEach(function (id) { if (byId[id]) ml.appendChild(Stream.card(byId[id])); });
      if (ml.children.length) document.getElementById("mlrow").hidden = false;

      var fresh = all.filter(function (m) { return m.added && Date.now() - m.added < 14 * 864e5; }).sort(function (a, b) { return b.added - a.added; }).slice(0, 15);
      if (fresh.length >= 3 && fresh.length < all.length * 0.6) addRow("New on stream", fresh);

      var seen = {}; watched.forEach(function (id) { seen[id] = 1; });
      if (watched.length) {
        var last = byId[watched[0]];
        addRow("Because you watched " + last.title, all.filter(function (m) { return m.genre === last.genre && !seen[m.id]; }).slice(0, 15));
        var score = {}; watched.forEach(function (id) { var g = byId[id].genre; score[g] = (score[g] || 0) + 1; });
        Stream.mylist.ids().forEach(function (id) { var f = byId[id]; if (f) score[f.genre] = (score[f.genre] || 0) + 2; });
        addRow("Recommended for you", all.filter(function (m) { return !seen[m.id]; })
          .sort(function (a, b) { return (score[b.genre] || 0) - (score[a.genre] || 0) || a._i - b._i; }).slice(0, 15));
      } else addRow("Popular on stream", all.slice(0, 15));

      var counts = {}; all.forEach(function (m) { counts[m.genre] = (counts[m.genre] || 0) + 1; });
      Object.keys(counts).filter(function (g) { return counts[g] >= 3; })
        .sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 6)
        .forEach(function (g) {
          addRow(g === "Horror" ? "For horror fans" : "Popular in " + g, all.filter(function (m) { return m.genre === g; }).slice(0, 15));
        });
    });
  }); });
  </script>
  <script src="helper.js"></script>
  <script src="pwa.js"></script>
  <script src="intro.js"></script>
  <script type="module" src="guard.js"></script>
</body>
</html>
