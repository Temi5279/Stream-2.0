<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>str▶eam - Free Classic Cinema & Public Domain Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tv-logo">str▶eam</div>

    <nav class="nav-container">
        <a href="index.html" class="nav-link active" tabindex="1">
            <svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span>
        </a>
        <a href="live-tv.html" class="nav-link" tabindex="2">
            <svg class="icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg><span>Live TV</span>
        </a>
        <a href="discover.html" class="nav-link" tabindex="3">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Discover</span>
        </a>
        <a href="profile.html" class="nav-link" tabindex="4">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span>
        </a>
    </nav>

    <div class="main-layout">
        <!-- Hero Stage Video Player -->
        <div class="hero">
            <video id="mainCinemaPlayer" controls autoplay muted playsinline poster="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200&q=80"></video>
            <div class="hero-content">
                <h1 class="hero-title" id="cinemaTitle">Select a Movie</h1>
                <div class="hero-meta" id="cinemaMeta">Public Domain Archive</div>
            </div>
        </div>

        <!-- Dynamic Category Rows -->
        <div id="categories-wrapper"></div>

        <!-- Footer with Legal Links -->
        <footer class="site-footer">
            <p>&copy; 2026 str▶eam. All public domain content hosted via Archive.org.</p>
            <div class="footer-links">
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </footer>
    </div>

    <!-- External Database Script -->
    <script src="movies.js"></script>
    <script>
        const wrapper = document.getElementById('categories-wrapper');
        const player = document.getElementById('mainCinemaPlayer');

        // Check if library data loaded correctly from movies.js
        if (typeof library !== 'undefined' && library.length > 0) {
            library.forEach((cat) => {
                const h2 = document.createElement('h2');
                h2.className = 'row-title';
                h2.innerText = cat.category;
                wrapper.appendChild(h2);

                const row = document.createElement('div');
                row.className = 'movie-row';

                cat.movies.forEach((m) => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.style.backgroundImage = `url(${m.img})`;
                    card.innerHTML = `
                        <div class="movie-info">
                            <div class="card-title">${m.title}</div>
                            <div class="card-year">${m.year} • ${m.genre}</div>
                        </div>
                    `;

                    // Swaps the video stream link when clicked
                    card.addEventListener('click', () => {
                        document.getElementById('cinemaTitle').innerText = m.title;
                        document.getElementById('cinemaMeta').innerText = `${m.year} • ${m.genre}`;
                        player.src = m.streamUrl;
                        player.play();
                    });

                    row.appendChild(card);
                });
                wrapper.appendChild(row);
            });

            // Set the initial default movie to the first item
            player.src = library[0].movies[0].streamUrl;
            document.getElementById('cinemaTitle').innerText = library[0].movies[0].title;
            document.getElementById('cinemaMeta').innerText = `${library[0].movies[0].year} • ${library[0].movies[0].genre}`;
        }
    </script>
</body>
</html>
