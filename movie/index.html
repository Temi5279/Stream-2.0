<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040a22">
  <title>Discover · str▶eam</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../style.css">
  <script>document.documentElement.classList.add("auth-wait");try{if(localStorage.getItem("stream-kids")==="1")document.documentElement.classList.add("kids")}catch(e){}setTimeout(function(){document.documentElement.classList.remove("auth-wait")},6000)</script>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../icons/icon-192.png" type="image/png" sizes="192x192">
</head>
<body>

  <nav class="nav glass" aria-label="Main">
    <a class="logo" href="../" aria-label="stream home">str<span>▶</span>eam</a>
    <ul>
      <li><a href="../"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</a></li>
      <li><a href="../live/"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Live TV</a></li>
      <li>
        <a href="../downloads/">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></svg>
          Downloads
        </a>
      </li>
      <li><a href="../discover/" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Discover</a></li>
      <li><a href="../profile/"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</a></li>
    </ul>
  </nav>

  <main id="m"></main>

  <script src="../app.js"></script>
  <script>
  Stream.movies().then(function (all) {
    function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }
    var id = new URLSearchParams(location.search).get("id"), root = document.getElementById("m");
    var m = all.filter(function (x) { return x.id === id; })[0];
    if (!id) { root.innerHTML = '<p class="empty">No film selected. Open Discover and pick one.</p>'; return; }
    if (!m) { root.innerHTML = '<p class="empty">Film not found: ' + esc(id) + '</p>'; return; }
    document.title = m.title + " · str▶eam";
    var s = Stream.progress()[id], resume = s && s.t > 5 && s.t < s.d - 30;
    var thumb = Stream.thumb(id);
    root.innerHTML =
      '<div class="m-bg" style="background-image:url(' + thumb + ')"></div>' +
      '<div class="m-wrap"><img class="m-poster" src="' + thumb + '" alt="' + esc(m.title) + ' poster">' +
      '<div class="m-info"><h1>' + esc(m.title) + '</h1>' +
      '<p class="m-meta"><span>' + esc(m.year) + '</span><span>' + esc(m.runtime) + '</span><span>' + esc(m.genre) + '</span>' +
      (m.rating ? '<span class="m-rate">★ ' + esc(m.rating) + ' IMDb</span>' : '') + '</p>' +
      '<a class="btn" href="' + Stream.watchUrl(id) + '">' + (resume ? 'Resume' : 'Play') + '</a>' +
      '<p class="m-desc">' + esc(m.description) + '</p>' +
      '<dl class="m-dl">' + (m.director ? '<dt>Director</dt><dd>' + esc(m.director) + '</dd>' : '') +
      (m.cast && m.cast.length ? '<dt>Cast</dt><dd>' + esc(m.cast.join(", ")) + '</dd>' : '') +
      (m.rights ? '<dt>Rights</dt><dd>' + esc(m.rights) + '</dd>' : '') + '</dl>' +
      '<a class="m-src" href="https://archive.org/details/' + encodeURIComponent(id) + '" target="_blank" rel="noopener">View on the Internet Archive</a>' +
      '</div></div>';
  });
  </script>
  <script src="../helper.js"></script>
  <script src="../pwa.js"></script>
  <script type="module" src="../guard.js"></script>
</body>
</html>
