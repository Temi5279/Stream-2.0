<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>str▶eam - Home</title>
    <style>
        :root { 
            --brand-blue: #0064ff; 
            --bg-dark: #040714; 
            --glass: rgba(255, 255, 255, 0.15); 
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-dark); 
            color: white; 
            margin: 0; 
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
        }

        :focus { 
            outline: none; 
            border: 3px solid var(--brand-blue) !important; 
            transform: scale(1.05); 
            box-shadow: 0 0 25px var(--brand-blue); 
            z-index: 10; 
            background: rgba(0, 100, 255, 0.2); 
        }

        .nav-container { 
            background: rgba(4, 7, 20, 0.9); 
            backdrop-filter: blur(20px); 
            z-index: 1000; 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex;
        }

        .nav-link { 
            color: rgba(255,255,255,0.5); 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            transition: 0.3s; 
            border-radius: 10px; 
            padding: 8px; 
        }
        
        .nav-link.active { 
            color: var(--brand-blue); 
            text-shadow: 0 0 10px var(--brand-blue); 
        }
        
        .icon { width: 24px; height: 24px; fill: currentColor; }
        .tv-logo { display: none; } 

        .main-layout { width: 100%; display: flex; flex-direction: column; }

        /* THE LIVE CINEMA STAGE SCREEN */
        .hero { 
            height: 60vh; 
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .hero video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 40px 30px;
            background: linear-gradient(to top, var(--bg-dark) 30%, transparent);
        }
        
        .hero-title { font-size: 2.8em; margin: 0; font-weight: 900; text-transform: uppercase; }
        .hero-meta { font-size: 0.9em; color: rgba(255,255,255,0.6); margin: 5px 0 15px 0; }
        
        /* ROWS & GRIDS */
        .row-title { padding-left: 30px; font-size: 1.4em; margin-top: 30px; font-weight: 700; }
        .movie-row { display: flex; gap: 20px; padding: 10px 30px 20px 30px; overflow-x: auto; scrollbar-width: none; }
        .movie-row::-webkit-scrollbar { display: none; }
        
        .movie-card { 
            min-width: 220px; height: 125px; background: var(--glass); border-radius: 8px; 
            background-size: cover; background-position: center; cursor: pointer; transition: 0.3s; 
            position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-info {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 15px 10px 8px 10px; font-size: 0.85em; opacity: 0; transition: opacity 0.3s ease;
        }

        .movie-card:hover .movie-info, .movie-card:focus .movie-info { opacity: 1; }
        .card-title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-year { font-size: 0.8em; color: rgba(255,255,255,0.6); }

        /* DEVICE STYLES */
        @media (max-width: 599px) {
            .nav-container { position: fixed; bottom: 0; left: 0; right: 0; justify-content: space-around; padding: 10px 0; border-radius: 20px 20px 0 0; }
            .main-layout { padding-bottom: 90px; }
            .hero { height: 35vh; }
        }

        @media (min-width: 600px) and (max-width: 1024px) {
            body { flex-direction: row; }
            .nav-container { position: fixed; left: 0; top: 0; bottom: 0; width: 90px; flex-direction: column; justify-content: center; gap: 35px; padding: 0 10px; border-radius: 0 20px 20px 0; }
            .main-layout { margin-left: 110px; }
        }

        @media (min-width: 1025px) {
            .nav-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: fit-content; border-radius: 50px; padding: 12px 40px; gap: 40px; z-index: 1000; }
            .tv-logo { display: block; position: fixed; bottom: 40px; right: 50px; font-size: 2.5em; color: var(--brand-blue); font-weight: bold; z-index: 1000; }
            .hero { height: 70vh; }
            .hero-content { padding: 60px; }
            .hero-title { font-size: 5em; }
            .row-title { padding-left: 60px; }
            .movie-row { padding: 20px 60px; }
        }
    </style>
</head>
<body>

    <div class="tv-logo">str▶eam</div>

    <nav class="nav-container">
        <a href="stream-home.html" class="nav-link active" tabindex="1"><svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Home</span></a>
        <a href="live-tv.html" class="nav-link" tabindex="2"><svg class="icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg><span>Live TV</span></a>
        <a href="discover.html" class="nav-link" tabindex="3"><svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Discover</span></a>
        <a href="profile.html" class="nav-link" tabindex="4"><svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Profile</span></a>
    </nav>

    <div class="main-layout">
        <div class="hero">
            <video id="mainCinemaPlayer" controls autoplay muted playsinline poster="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200&q=80"></video>
            <div class="hero-content">
                <h1 class="hero-title" id="cinemaTitle">Night of the Living Dead</h1>
                <div class="hero-meta" id="cinemaMeta">1968 • Horror/Sci-Fi</div>
            </div>
        </div>

        <div id="categories-wrapper"></div>
    </div>

    <script>
        const library = [
            {
                category: "Classic Cinema Hits",
                movies: [
                    { title: "Night of the Living Dead", year: 1968, genre: "Horror", streamUrl: "https://archive.org/download/night_of_the_living_dead/night_of_the_living_dead_512kb.mp4", img: "https://images.unsplash.com/photo-1505635552518-3448ff116af3?w=400&q=80" },
                    { title: "The Fast and the Furious", year: 1954, genre: "Action", streamUrl: "https://archive.org/download/the_fast_and_the_furious/the_fast_and_the_furious_512kb.mp4", img: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=400&q=80" },
                    { title: "Gulliver's Travels", year: 1939, genre: "Animation", streamUrl: "https://archive.org/download/gullivers_travels_1939/gullivers_travels_1939_512kb.mp4", img: "https://images.unsplash.com/photo-1608889174639-414d9fde9bfd?w=400&q=80" },
                    { title: "The General (Buster Keaton)", year: 1926, genre: "Comedy", streamUrl: "https://archive.org/download/Buster_Keaton_The_General/The_General_512kb.mp4", img: "https://images.unsplash.com/photo-1533928298208-27ff66555d8d?w=400&q=80" }
                ]
            }
        ];

        const wrapper = document.getElementById('categories-wrapper');
        const player = document.getElementById('mainCinemaPlayer');

        library.forEach((cat) => {
            const h2 = document.createElement('h2');
            h2.className = 'row-title';
            h2.innerText = cat.category;
            wrapper.appendChild(h2);

            const row = document.createElement('div');
            row.className = 'movie-row';

            cat.movies.forEach((m) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.style.backgroundImage = `url(${m.img})`;
                card.innerHTML = `
                    <div class="movie-info">
                        <div class="card-title">${m.title}</div>
                        <div class="card-year">${m.year} • ${m.genre}</div>
                    </div>
                `;

                // Swaps the video stream link when clicked
                card.addEventListener('click', () => {
                    document.getElementById('cinemaTitle').innerText = m.title;
                    document.getElementById('cinemaMeta').innerText = `${m.year} • ${m.genre}`;
                    player.src = m.streamUrl;
                    player.play();
                });

                row.appendChild(card);
            });
            wrapper.appendChild(row);
        });

        // Set the initial default movie
        player.src = library[0].movies[0].streamUrl;
    </script>
</body>
                                                                                                       </html>
