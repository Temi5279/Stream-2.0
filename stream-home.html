        :root { 
            --brand-blue: #0064ff; 
            --bg-dark: #040714;

        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-dark); 
            color: white; 
            margin: 0; 
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* REMOTE FOCUS STYLE */
        :focus { 
            outline: none; 
            border: 3px solid var(--brand-blue) !important; 
            transform: scale(1.05); 
            box-shadow: 0 0 25px var(--brand-blue); 
            z-index: 10; 
            background: rgba(0, 100, 255, 0.2); 
        }

        /* GENERAL NAV CONTAINER SETUP */
        .nav-container { 
            background: rgba(4, 7, 20, 0.9); 
            backdrop-filter: blur(20px); 
            z-index: 1000; 
            border: 1px solid rgba(255,255,255,0.1); 
            display: flex;
            transition: all 0.3s ease;
        }

        .nav-link { 
            color: rgba(255,255,255,0.5); 
            text-decoration: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 4px; 
            transition: 0.3s; 
            border-radius: 10px; 
            padding: 8px; 
        }
        
        .nav-link.active { 
            color: var(--brand-blue); 
            text-shadow: 0 0 10px var(--brand-blue); 
        }
        
        .icon { width: 24px; height: 24px; fill: currentColor; }
        .tv-logo { display: none; } 

        /* MAIN CONTENT WRAPPER */
        .main-layout {
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* HERO AREA */
        .hero { 
            height: 65vh; 
            display: flex; 
            align-items: flex-end; 
            padding: 30px; 
            background: linear-gradient(to top, var(--bg-dark) 15%, transparent), 
                        url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1450&auto=format&fit=crop') center/cover no-repeat;
        }
        
        .hero-title {
            font-size: 2.8em; 
            margin: 0;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .hero-meta {
            font-size: 0.9em;
            color: rgba(255,255,255,0.6);
            margin: 5px 0 15px 0;
        }

        .btn-play { 
            background: white; 
            color: black; 
            padding: 12px 30px; 
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 1em; 
            cursor: pointer; 
            margin-right: 12px; 
            transition: 0.2s;
        }
        
        /* MOVIE GRID */
        .row-title { padding-left: 30px; font-size: 1.4em; margin-top: 40px; font-weight: 700; letter-spacing: 0.5px; }
        .movie-row { display: flex; gap: 20px; padding: 10px 30px 20px 30px; overflow-x: auto; scrollbar-width: none; }
        .movie-row::-webkit-scrollbar { display: none; }
        
        .movie-card { 
            min-width: 220px; 
            height: 125px; 
            background: var(--glass); 
            border-radius: 8px; 
            background-size: cover; 
            background-position: center; 
            cursor: pointer; 
            transition: 0.3s; 
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .movie-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 15px 10px 8px 10px;
            font-size: 0.85em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .movie-card:hover .movie-info, .movie-card:focus .movie-info {
            opacity: 1;
        }

        .card-title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-year { font-size: 0.8em; color: rgba(255,255,255,0.6); margin-top: 2px; }

        /* =======================================================
           1. PHONE LAYOUT
           ======================================================= */
        @media (max-width: 599px) {
            .nav-container { 
                position: fixed; 
                bottom: 0; 
                left: 0; 
                right: 0; 
                justify-content: space-around; 
                padding: 10px 0; 
                border-radius: 20px 20px 0 0; 
            }
            .main-layout { padding-bottom: 90px; }
        }

        /* =======================================================
           2. LAPTOP LAYOUT (Sideways Sidebar)
           ======================================================= */
        @media (min-width: 600px) and (max-width: 1024px) {
            body { flex-direction: row; }
            
            .nav-container {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 90px;
                flex-direction: column;
                justify-content: center;
                gap: 35px;
                padding: 0 10px;
                border-radius: 0 20px 20px 0;
            }

            .main-layout { margin-left: 110px; }
            .hero { padding: 40px; height: 60vh; }
            .hero-title { font-size: 3.8em; }
            .movie-card { min-width: 240px; height: 135px; }
        }

        /* =======================================================
           3. TV LAYOUT (Top Pill Bar)
           ======================================================= */
        @media (min-width: 1025px) {
            .nav-container { 
                position: fixed; 
                top: 20px; 
                left: 50%;
                transform: translateX(-50%);
                width: fit-content; 
                border-radius: 50px; 
                padding: 12px 40px; 
                gap: 40px; 
            }

                display: block;

                right: 50px; 
                font-size: 2.5em; 
                color: var(--brand-blue); 
                font-weight: bold; 
                z-index: 1000;
                text-shadow: 0 0 15px rgba(0, 100, 255, 0.4);

            .hero-title { font-size: 5.5em; }
            .btn-play { padding: 15px 45px; font-size: 1.2em; }
            .row-title { padding-left: 60px; font-size: 1.6em; }
            .movie-row { padding: 20px 60px; }
            .movie-card { min-width: 280px; height: 155px; }
        }
    </style>
