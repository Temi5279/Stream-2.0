name: Update share pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-share.mjs
      - run: |
          git config user.name "stream-bot"
          git config user.email "bot@users.noreply.github.com"
          git add f
          git diff --cached --quiet || (git commit -m "Update share pages" && git push)
