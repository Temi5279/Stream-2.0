name: Update movie list
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  movies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-movies.mjs
      - run: |
          git config user.name "stream-bot"
          git config user.email "bot@users.noreply.github.com"
          git add movies.json
          git diff --cached --quiet || (git commit -m "Update movie list" && git push)
